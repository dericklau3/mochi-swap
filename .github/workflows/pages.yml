name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publishing the main branch directly deploys source index.html and races
      # this workflow. The repository Pages source must be GitHub Actions.
      - name: Verify Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages(context.repo);
            if (data.build_type !== 'workflow') {
              core.setFailed('Set Settings → Pages → Build and deployment → Source to GitHub Actions. Publishing main directly overwrites the built site with uncompiled source and causes blank pages.');
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          GITHUB_PAGES: "true"
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID || vars.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_BSC_TESTNET_RPC_URL: ${{ secrets.VITE_BSC_TESTNET_RPC_URL || vars.VITE_BSC_TESTNET_RPC_URL }}

      - name: Verify built Pages artifact
        run: node scripts/verify-pages.mjs dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
