name: Temporary dependency autofix

on:
  push:
    branches:
      - security/harden-swap-permit2-20261105

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the security branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Repair compatible vulnerable dependency versions
        run: bun audit fix || true
      - name: Show remaining advisories
        run: bun audit --audit-level=high || true
      - name: Commit only dependency changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "No dependency changes necessary"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore(deps): automatically repair compatible security advisories"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:security/harden-swap-permit2-20261105
